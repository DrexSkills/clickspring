.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}

.rec .btn{white-space:normal;text-align:center}
.thumb{border-radius:12px;background:linear-gradient(140deg,#6b706b,#2a2e2b 55%,#191c1a);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.fakebtn{background:#0b0f0c;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center;box-shadow:0 10px 20px -6px rgba(0,0,0,.6);transform:translateY(22%)}
.est{display:flex;gap:10px;align-items:center;margin-top:18px;font-weight:500}

.ai-insight b svg{color:var(--gold)}

.ai-insight .btn{width:100%;color:#05260f;background:#2bd468}
.funnel .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin-bottom:6px}
.funnel .bar{grid-column:1/-1;height:34px;border-radius:10px;background:var(--green);opacity:var(--o,1);width:var(--w)}
.funnel .nm{font-weight:600}.funnel .ct{font-weight:800}
.funnel .loss{font-size:13px;color:var(--muted);margin:2px 0 12px;padding-left:10px;border-left:2px solid var(--line)}
.funnel .loss.big{color:var(--bad);border-color:var(--bad);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.tip{border:1px solid var(--line);border-radius:18px;padding:18px 18px 18px 22px;position:relative;background:var(--card);margin-bottom:12px}
.tip::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--green))}
.tip.high{--c:var(--bad)}.tip.med{--c:var(--warn)}.tip.low,.tip.setup{--c:var(--violet)}
.tip h3{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
.tip p{margin:0 0 8px;color:var(--muted)}
.tip .fix{color:var(--ink);background:var(--green-soft);border-radius:12px;padding:10px 12px;margin:10px 0 0}
.tip .fix b{color:var(--green-ink)}
.tip .est{margin-top:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted);margin-bottom:8px}
.ai-box{background:#101411;color:#fff;border-radius:20px;padding:20px;margin-bottom:16px}
.ai-box p{opacity:.85;margin:4px 0 12px}
.ai-out{white-space:pre-wrap;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-weight:600;font-size:14px}
.field input,.field select,.field textarea,select.range{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:42px;font-weight:500;width:100%}
select.range{width:auto}
.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@container (max-width:700px){.form-row{grid-template-columns:1fr}}
.camp{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--card)}
.camp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.camp-h b{font-size:16px}
.camp-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
@container (max-width:700px){.camp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.camp-stats div{background:var(--surface);border-radius:12px;padding:10px}
.camp-stats small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.camp-stats strong{font-size:18px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px}
.views-in{width:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
pre.code{background:#101411;color:#e9efe9;border-radius:14px;padding:16px;overflow-x:auto;font-size:13px;line-height:1.55;margin:0 0 12px}
.empty{text-align:center;padding:40px 20px}
.empty h2{justify-content:center}
.sim{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.log{font-size:13px;color:var(--muted);max-height:180px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.auth{max-width:440px;margin:30px auto;padding:0 20px;position:relative;z-index:1}
.loading{padding:60px;text-align:center;color:var(--muted)}
.src-bar{height:8px;border-radius:999px;background:var(--surface);overflow:hidden;min-width:80px}
.src-bar i{display:block;height:100%;border-radius:999px}
/* ---------- Demo video popup ---------- */
.play-dot{width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;margin-left:-8px}
.play-dot svg{margin-left:2px}
.vmodal{border:0;padding:0;background:transparent;width:min(960px,calc(100vw - 32px));max-width:none;max-height:none;overflow:visible}
.vmodal::backdrop{background:rgba(6,40,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vbox{background:var(--card);border-radius:26px;padding:14px;box-shadow:0 0 0 3px var(--green),0 40px 100px -20px rgba(0,0,0,.6)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 14px 8px}
.vhead b{font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;color:var(--ink)}
.vclose{width:40px;height:40px;border-radius:50%;border:0;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;cursor:pointer;font-size:22px;line-height:1}
.vstage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#2bd468 0%,#14a845 40%,#0a5a26 100%)}
.vstage iframe,.vstage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vposter{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;color:#fff;text-align:center;padding:20px}
.vposter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 28px)}
.vplay{position:relative;width:96px;height:96px;border-radius:50%;border:0;background:#2bd468;color:#05260f;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 10px rgba(255,255,255,.18),0 20px 40px -10px rgba(0,0,0,.45);transition:transform .15s}
.vplay:hover{transform:scale(1.06)}
.vplay svg{margin-left:6px}
.vplay::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.55);animation:vpulse 1.8s ease-out infinite}
@keyframes vpulse{from{transform:scale(1);opacity:1}to{transform:scale(1.45);opacity:0}}
@media(prefers-reduced-motion:reduce){.vplay::after{animation:none}}
.vposter p{position:relative;margin:0;font-weight:700;font-size:clamp(18px,2.4vw,26px);letter-spacing:-.02em;max-width:22em}
.vposter small{position:relative;opacity:.85;font-size:15px}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 6px 4px 8px;color:var(--muted)}
@media(max-width:560px){.vplay{width:72px;height:72px}.vbox{padding:10px;border-radius:20px}}
/* ---------- Auth pages ---------- */
.auth-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.auth-form{display:flex;flex-direction:column;padding:28px 40px;gap:24px;min-width:0}
.auth-card{width:100%;max-width:420px;margin:auto}
.auth-card h1{font-size:clamp(28px,3vw,36px);letter-spacing:-.04em;margin:0 0 6px;line-height:1.1}
.auth-card .sub{color:var(--muted);margin:0 0 24px;font-size:16px}
.auth-card .field input{min-height:50px;font-size:16px}
.auth-card .field{position:relative}
.forgot{position:absolute;right:0;top:0;font-weight:600;color:var(--green-ink);text-decoration:none}
.pw{position:relative;display:block}
.pw input{padding-right:64px}
.pw-t{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:6px}
.hint{margin:-8px 0 14px;color:var(--muted);font-size:13px}
.alert{border-radius:12px;padding:11px 14px;font-size:14px;margin:0 0 14px;font-weight:500}
.alert.err{background:rgba(212,52,44,.1);color:var(--bad)}
.alert.ok{background:var(--green-soft);color:var(--green-ink)}
.switch{text-align:center;color:var(--muted);margin:20px 0 0}
.switch a{color:var(--green-ink);font-weight:700;text-decoration:none}
.tiny{color:var(--muted);font-size:12px;margin:0;text-align:center}
.step-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--green-ink);background:var(--green-soft);border-radius:999px;padding:4px 12px;margin-bottom:12px}
.waiting{display:flex;align-items:center;gap:10px;font-weight:600;background:var(--surface);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.waiting .st-dot{margin:0}
.mail-ic{width:56px;height:56px;border-radius:16px;background:var(--green-soft);color:var(--green-ink);display:grid;place-items:center;margin-bottom:16px}
.auth-side{margin:14px;border-radius:30px;background:radial-gradient(120% 90% at 20% 10%,#2bd468 0%,#14a845 45%,#0a5a26 100%);color:#fff;padding:56px clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:26px;position:relative;overflow:hidden}
.auth-side::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 30px);pointer-events:none}
.auth-side > *{position:relative}
.auth-side h2{font-size:clamp(34px,3.6vw,52px);line-height:1.05;letter-spacing:-.045em;margin:0;max-width:11em}
.pill.light{background:rgba(255,255,255,.18);color:#fff;align-self:flex-start}
.pill.light::before{background:#fff}
.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:20px 22px;max-width:420px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gl-h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px;opacity:.95}
.gl-row{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 10px;margin-bottom:12px}
.gl-row b{font-size:26px;letter-spacing:-.03em}
.gl-row span{opacity:.9}
.gl-bar{grid-column:1/-1;height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.gl-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.tip-g p{margin:6px 0 0;opacity:.95}
.tip-g{margin-left:clamp(0px,4vw,60px);transform:rotate(-2deg)}
@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-side{display:none}.auth-form{padding:22px 20px}}
/* ---------- Tracking setup ---------- */
.status-card{border-width:2px}
.st-row{display:flex;gap:14px;align-items:flex-start}
.st-row b{font-size:18px;letter-spacing:-.01em}
.st-row p{margin:2px 0 0}
.st-dot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:6px;background:var(--muted)}
.st-dot.ok{background:var(--green);box-shadow:0 0 0 5px var(--green-soft)}
.st-dot.bad{background:var(--bad)}
.st-dot.wait{background:var(--warn);animation:stp 1.6s ease-in-out infinite}
@keyframes stp{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.st-dot.wait{animation:none}}
.checks{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@container (max-width:760px){.checks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.checks li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px}
.checks li b{display:block;font-size:14px}
.checks li small{color:var(--muted);font-size:12px}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--on-green)}
.checks li.done .ck{background:var(--green);border-color:var(--green)}
.plat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.plat-help{margin:0 0 12px;color:var(--ink);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14px}
.ev{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--surface)}
.ev-pageview{background:var(--green-soft);color:var(--green-ink)}
.ev-click{background:rgba(124,92,255,.14);color:var(--violet)}
.ev-signup{background:var(--green);color:var(--on-green)}
.sim-card summary{cursor:pointer;list-style:revert}
.sim-card[open] summary{margin-bottom:8px}
/* ---------- Journeys & leak card ---------- */
.bar-row{margin-bottom:14px}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.bar-top span{color:var(--muted);white-space:nowrap}
.dual{display:grid;grid-template-columns:96px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}
.jrow{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.jmeta{display:flex;flex-direction:column;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--surface);white-space:nowrap}
.chip.ck2{background:rgba(124,92,255,.12);color:var(--violet)}
.chip.ok{background:var(--green);color:var(--on-green)}
.chip.more{color:var(--muted)}
.jout{font-size:13px;font-weight:700;color:var(--bad);white-space:nowrap}
.jout.ok{color:var(--green-ink)}
@container (max-width:640px){.jrow{grid-template-columns:1fr}.jmeta{flex-direction:row;gap:10px}}
.leak .badge{background:rgba(212,52,44,.1);color:var(--bad)}
.leak-t{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:0 0 6px}
.leak p.muted{margin:0 0 16px}
.ai-insight .lk{color:#ff8a83}
/* ---------- Guided tour ---------- */
.tour-block{position:fixed;inset:0;z-index:60}
.tour-spot{position:fixed;z-index:61;left:50%;top:50%;width:0;height:0;border-radius:18px;box-shadow:0 0 0 9999px rgba(6,22,12,.58),0 0 0 3px var(--green);pointer-events:none;transition:left .5s cubic-bezier(.2,.8,.2,1),top .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1)}
.tour-cursor{position:fixed;left:0;top:0;z-index:63;pointer-events:none;transition:transform .9s cubic-bezier(.45,.05,.25,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}

.tour-tip{position:fixed;z-index:64;left:12px;top:12px;width:min(360px,calc(100vw - 24px));background:var(--card);color:var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5),0 0 0 1px var(--line);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}

.tour-tip h3{margin:8px 0 6px;font-size:18px;letter-spacing:-.02em}
.tour-tip p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.tour-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--green-ink)}
.tour-skip{background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:4px}

.tour-dots{display:flex;gap:4px;flex-wrap:wrap}

.tour-sample{position:fixed;z-index:64;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#101411;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}

.conf{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}

async function deviceInfo(){

  let canvas = "";
  try { const c = document.createElement("canvas"); c.width = 220; c.height = 40; const x = c.getContext("2d"); x.textBaseline = "top"; x.font = "16px Arial"; x.fillStyle = "#1fbf4f"; x.fillRect(0, 0, 60, 20); x.fillStyle = "#0b0f0c"; x.fillText("ClickSpring ✓ 🌱", 4, 12); canvas = c.toDataURL(); } catch (e) {}
  const parts = [navigator.userAgent, navigator.language, (navigator.languages || []).join(","), screen.width + "x" + screen.height + "x" + screen.colorDepth, window.devicePixelRatio, (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone, navigator.hardwareConcurrency, navigator.maxTouchPoints, navigator.platform, canvas].join("|");

  return {device_id: id, fp};
}
function makeSample(){
    const r = mulberry32(42), now = Date.now();
    const camps = [
      {id: uid(), name: "Morning routine reel", platform: "instagram", slug: "morning-routine", views: 18400, created: now - 50*DAY},
      {id: uid(), name: "3 tips video", platform: "tiktok", slug: "3-tips", views: 10000, created: now - 25*DAY},
      {id: uid(), name: "Studio tour short", platform: "youtube", slug: "studio-tour", views: 6200, created: now - 45*DAY}
    ];
    const W = [["instagram",.36],["tiktok",.035],["youtube",.13],["google",.19],["direct",.21],["x",.075]];
    const CLICK = {instagram:.15,tiktok:.09,youtube:.21,google:.26,direct:.19,x:.1};
    const ev = [];
    for (let d = 59; d >= 0; d--) {
      const n = Math.round((15 + r()*12) * (1 + (59 - d) / 59 * .55));
      for (let i = 0; i < n; i++) {
        let x = r(), s = "other"; for (const [k, w] of W) { if ((x -= w) < 0) { s = k; break; } }
        const ts = now - d*DAY - r()*DAY + 6e4, v = uid();
        const cp = camps.find(c => c.platform === s && ts > c.created && r() < .85);
        const c = cp ? cp.id : null;
        const dv = r() < ({instagram:.88,tiktok:.94,youtube:.7,x:.75}[s] || .45) ? "mobile" : "desktop";
        ev.push({t:"pageview", v, s, c, p:"/", l:null, d: dv, ts});
        if (r() < .3) ev.push({t:"pageview", v, s, c, p: r() < .5 ? "/pricing" : "/about", l:null, d: dv, ts: ts + 3e4});
        if (r() < (CLICK[s] || .12) * (dv === "mobile" ? .8 : 1.5)) {
          ev.push({t:"click", v, s, c, p:"/", l: r() < .8 ? "Get the free guide" : "See pricing", d: dv, ts: ts + 2e4});
          if (r() < (s === "tiktok" ? .5 : .24)) ev.push({t:"signup", v, s, c, p:"/", l:"signup form", d: dv, ts: ts + 9e4});
        }
      }
    }
  return {events: ev.sort((a, b) => a.ts - b.ts), campaigns: camps};
}

  async deleteSite(id){ const { error } = await this.sb.from("sites").delete().eq("id", id); if (error) throw error; this.sites = this.sites.filter(x => x.id !== id); try { localStorage.removeItem("cs_site_" + this.user.id); } catch (e) {} return this.site = this.sites[0] || null; },
  async restartSite(){ const { error } = await this.sb.rpc("restart_site", {p_site: this.site.id}); if (error) throw error; },
  async deleteAccount(){ const { error } = await this.sb.rpc("delete_my_account"); if (error) throw error; try { await this.sb.auth.signOut({ scope: "local" }); } catch (e) {} this.user = null; this.site = null; this.sites = []; },
  async usage(){ const t = new Date(), m = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-01`; const { data } = await this.sb.from("usage_monthly").select("events").eq("site_id", this.site.id).eq("month", m).maybeSingle(); return {events: data ? data.events : 0}; },
  async apiKeys(){ const { data, error } = await this.sb.from("api_keys").select("id,name,prefix,created_at,last_used_at,revoked_at").eq("site_id", this.site.id).is("revoked_at", null).order("created_at", {ascending: false}); if (error) throw error; return data; },
  async createApiKey(name){ const { data, error } = await this.sb.rpc("create_api_key", {p_site: this.site.id, p_name: name}); if (error) throw error; return data; },
  async revokeApiKey(id){ const { error } = await this.sb.rpc("revoke_api_key", {p_id: id}); if (error) throw error; },
  async askAI(summary){
    const { data, error } = await this.sb.functions.invoke("advisor", { body: { summary } });
    if (error) { let msg = error.message; try { const b = await error.context.json(); if (b && b.error) msg = b.error; } catch (_) {} throw new Error(msg); }
    return data.text;
  }
};

/* ---------- Analytics engine ---------- */
function summarize(list){
  const vis = new Set(), clk = new Set(), sig = new Set(); let pv = 0, clicks = 0;
  for (const e of list) {
    if (e.t === "pageview") { vis.add(e.v); pv++; }
    else if (e.t === "click") { clk.add(e.v); clicks++; vis.add(e.v); }
    else if (e.t === "signup") { sig.add(e.v); vis.add(e.v); }
  }
  return {visitors: vis.size, pageviews: pv, clicks, clickers: clk.size, signups: sig.size, conv: pct(sig.size, vis.size)};
}
function groupBy(list, keyOf){
  const first = new Map();
  for (const e of list) if (!first.has(e.v)) first.set(e.v, keyOf(e));
  const groups = new Map();
  for (const e of list) { const k = first.get(e.v); if (k == null) continue; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  return groups;
}
function compute(events, campaigns, days){
  const now = Date.now(), start = now - days*DAY, prevStart = start - days*DAY;
  const cur = events.filter(e => e.ts >= start), prev = events.filter(e => e.ts >= prevStart && e.ts < start);
  const c = summarize(cur), p = summarize(prev);
  const series = {visitors: [], clicks: [], signups: [], dates: []};
  const buckets = Array.from({length: days}, () => []);
  for (const e of cur) { const i = days - 1 - Math.floor((now - e.ts) / DAY); if (i >= 0 && i < days) buckets[i].push(e); }
  buckets.forEach((b, i) => { const s = summarize(b); series.visitors.push(s.visitors); series.clicks.push(s.clicks); series.signups.push(s.signups); series.dates.push(new Date(now - (days - 1 - i)*DAY)); });
  const sources = [...groupBy(cur, e => e.s || "direct")].map(([k, l]) => ({key: k, name: srcName(k), ...summarize(l)})).sort((a, b) => b.visitors - a.visitors);
  const campGroups = groupBy(events, e => e.c || null);
  const camps = campaigns.map(cp => ({...cp, ...summarize(campGroups.get(cp.id) || [])}));
  const perVisitor = new Map(); for (const e of cur) perVisitor.set(e.v, (perVisitor.get(e.v) || 0) + 1);
  let bounced = 0; for (const n of perVisitor.values()) if (n === 1) bounced++;
  const byV = new Map(); for (const e of cur) { if (!byV.has(e.v)) byV.set(e.v, []); byV.get(e.v).push(e); }
  const journeys = [...byV.values()].map(l => { l.sort((a, b) => a.ts - b.ts); const pv = l.filter(e => e.t === "pageview");
    return {v: l[0].v, s: l[0].s || "direct", start: l[0].ts, end: l[l.length - 1].ts, steps: l, converted: l.some(e => e.t === "signup"), exit: (pv.length ? pv[pv.length - 1].p : l[l.length - 1].p) || "/"}; });
  const leavers = journeys.filter(j => !j.converted), buyers = journeys.filter(j => j.converted);
  const exitMap = new Map(); for (const j of leavers) exitMap.set(j.exit, (exitMap.get(j.exit) || 0) + 1);
  const exits = [...exitMap].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([page, n]) => ({page, n, share: pct(n, leavers.length)}));
  const feat = j => new Set(j.steps.map(e => e.t === "pageview" ? `Visited ${e.p || "/"}` : e.t === "click" ? `Clicked “${e.l || "a button"}”` : null).filter(f => f && f !== "Visited /"));
  const fb = new Map(), fl = new Map();
  for (const j of buyers) for (const f of feat(j)) fb.set(f, (fb.get(f) || 0) + 1);
  for (const j of leavers) for (const f of feat(j)) fl.set(f, (fl.get(f) || 0) + 1);
  const diffs = buyers.length >= 3 ? [...fb].map(([f, n]) => ({f, b: pct(n, buyers.length), l: pct(fl.get(f) || 0, leavers.length)}))
    .filter(d => d.b >= 15 && d.b > d.l * 1.5).sort((a, b) => (b.b - b.l) - (a.b - a.l)).slice(0, 5) : [];
  const devices = [...groupBy(cur.filter(e => e.d), e => e.d)].map(([k, l]) => ({key: k, ...summarize(l)}));
  const signupEver = events.some(e => e.t === "signup");
  const clickedLeft = leavers.filter(j => j.steps.some(e => e.t === "click")).length;
  const count = (list, f) => { const m = new Map(); for (const e of list) { const k = f(e); if (k) m.set(k, (m.get(k) || 0) + 1); } return [...m].sort((a, b) => b[1] - a[1]).slice(0, 6); };
  return { days, c, p, series, sources, camps, bounce: pct(bounced, perVisitor.size), journeys, exits, diffs, clickedLeft, devices, signupEver, buyers: buyers.length, leavers: leavers.length,
    buttons: count(cur.filter(e => e.t === "click"), e => e.l), pages: count(cur.filter(e => e.t === "pageview"), e => e.p) };
}
const pageName = p => !p || p === "/" ? "Homepage" : p;
const delta = (a, b) => b ? (a - b) / b * 100 : null;
function deltaHTML(a, b){
  const d = delta(a, b);
  if (d === null) return `<span class="delta flat">New this period</span>`;
  const cls = d > 0.5 ? "" : d < -0.5 ? "down" : "flat";
  return `<span class="delta ${cls}">${d > 0.5 ? "↑" : d < -0.5 ? "↓" : "→"} ${Math.abs(Math.round(d))}% <span class="muted" style="font-weight:500">vs previous</span></span>`;
}

/* ---------- Why They Leave: diagnosis engine ---------- */
const conf = n => n >= 150 ? {level: "High confidence", cls: "hi", n} : n >= 30 ? {level: "Medium confidence", cls: "md", n} : {level: "Early signal", cls: "lo", n};
const SIGNUPISH = /sign|join|get|start|access|free|subscribe|register|try|book|buy|waitlist|download|claim/i;
function advise(m){
  const c = m.c, tips = [], V = c.visitors;
  if (V === 0) return [{key: "setup", lvl: "setup", impact: 100, tag: "Setup", title: "No visitors in this period yet", short: "Install the script and share your link.",
    evidence: [`0 visitors in the last ${m.days} days`], body: "ClickSpring can only explain what it can see. Once visitors arrive, this page fills in on its own.",
    steps: ["Add the tracking script to your site (Tracking Setup).", "Open your site with ?cs_debug=1 to confirm it’s working.", "Put a ClickSpring tracking link in your bio."], href: "#install", cta: "Open Tracking Setup", conf: conf(0)}];
  const ctr = pct(c.clickers, V), sr = pct(c.signups, c.clickers), convRate = V ? c.signups / V : 0;
  const topBtn = m.buttons[0] ? m.buttons[0][0] : null;

  // 1. Sign-ups never recorded
  if (!m.signupEver && c.clickers >= 1) tips.push({key: "track-signup", lvl: c.clickers >= 3 ? "high" : "setup", impact: 97, tag: "Sign-up tracking",
    title: `People clicked${topBtn ? ` “${topBtn}”` : ""}, but no sign-ups have been recorded`, short: "Check whether sign-ups are being counted.",
    evidence: [`${fmt(c.clickers)} of ${fmt(V)} visitors clicked a button`, "0 sign-ups recorded in the last 90 days"],
    body: "Either people stop at your sign-up form, or your sign-ups aren’t being counted yet. Find out which before changing your page.",
    steps: ["Open your site with ?cs_debug=1 and sign up yourself.", "If the green badge says “signup sent”, tracking works and the form is the problem — look at the other cards here.", "If it doesn’t, your form is probably an embed or redirect: add your thank-you page in Tracking Setup."],
    href: "#install", cta: "Open Tracking Setup", conf: conf(c.clickers)});

  // 2. Campaign posts that get views but no visits
  for (const cp of m.camps) {
    if (cp.views < 300) continue;
    const vr = pct(cp.visitors, cp.views);
    if (vr < 1.5) tips.push({key: "camp:" + cp.id, lvl: vr < .5 ? "high" : "med", impact: 93 - vr * 10, tag: srcName(cp.platform) + " post",
      title: `“${cp.name}” got ${fmt(cp.views)} views but only ${fmt(cp.visitors)} visits`, short: "Tell viewers exactly where to go next.",
      evidence: [`${pctStr(vr)} of viewers visited your site`, `${fmt(cp.signups)} of those visitors signed up`],
      body: "The leak is before your website: people watched, but didn’t know why or where to go next.",
      steps: cp.platform === "youtube"
        ? ["Put the tracking link in the first line of the description.", "Pin a comment with the link and what people get.", "Say it out loud near the end of the video."]
        : ["Say “link in my bio” out loud and show it on screen in the last 3 seconds.", "Pin a comment saying what people get when they tap it.", "Make sure your bio link is this tracking link."],
      gain: Math.max(1, Math.round((cp.views * .015 - cp.visitors) * Math.max(convRate, .02))), conf: conf(cp.visitors)});
  }

  // 3. Visitors don't click anything
  if (V >= 5 && ctr < 15) {
    const est = Math.max(c.signups + 1, Math.round(V * .15 * ((sr || 25) / 100)));
    tips.push({key: "cta", lvl: V >= 30 ? "high" : "med", impact: 90, tag: "First screen",
      title: `${pctStr(100 - ctr)} of visitors leave without clicking anything`, short: "Make the next step obvious on the first screen.",
      evidence: [`${fmt(c.clickers)} of ${fmt(V)} visitors clicked a button or link`, topBtn ? `Most-clicked: “${topBtn}”` : "No button clicks recorded"],
      body: "People arrive, look, and leave. Usually the first screen doesn’t say clearly enough what they get, or the button isn’t visible without scrolling.",
      steps: ["Rewrite the headline to say exactly what people get, in the words of the post that sent them.", "Put your main button on the first screen, on phones too.", "Use one main button, not several competing ones."],
      gain: est - c.signups, conf: conf(V)});
  }

  // 4. Visitors click a different button than sign-up
  if (m.buttons.length >= 2 && V >= 10) {
    const [l1, n1] = m.buttons[0];
    const signupBtn = m.buttons.find(([l]) => SIGNUPISH.test(l));
    if (signupBtn && !SIGNUPISH.test(l1) && n1 > signupBtn[1] * 1.5) tips.push({key: "btn:" + l1, lvl: "med", impact: 66, tag: "Buttons",
      title: `Visitors click “${l1}” more than “${signupBtn[0]}”`, short: `Answer what “${l1}” is about on the main page.`,
      evidence: [`“${l1}”: ${fmt(n1)} clicks`, `“${signupBtn[0]}”: ${fmt(signupBtn[1])} clicks`],
      body: "People are looking for something before they’re ready to sign up. Whatever that button leads to is a question your page isn’t answering.",
      steps: [`Bring the key info from “${l1}” onto your main page, right above the sign-up button.`, "Make the sign-up button the most visible thing on the screen."], conf: conf(V)});
  }

  // 5. Click, then quit at the form
  if (m.signupEver && c.clickers >= 5 && sr < 35) tips.push({key: "form", lvl: "high", impact: 84, tag: "Sign-up form",
    title: `${pctStr(100 - sr)} of people who click quit before signing up`, short: "Cut the form down to just an email.",
    evidence: [`${fmt(c.clickers)} clicked`, `${fmt(c.signups)} signed up`],
    body: "They wanted in, then something at the sign-up step stopped them: too many fields, a surprise (price, account, card), or a slow or broken form.",
    steps: ["Ask for an email only.", "Write the button in first person, like “Send me the guide”.", "Put one line of proof right next to it.", "Try signing up on your own phone and time it."],
    gain: Math.max(1, Math.round(c.clickers * .35) - c.signups), conf: conf(c.clickers)});

  // 6. Phones vs computers
  const mob = m.devices.find(d => d.key === "mobile"), desk = m.devices.find(d => d.key === "desktop");
  if (mob && desk && mob.visitors >= 5 && desk.visitors >= 5) {
    const mc = pct(mob.clickers, mob.visitors), dc = pct(desk.clickers, desk.visitors);
    const conv2 = desk.conv > 0 && desk.conv >= mob.conv * 2, click2 = dc >= 10 && dc >= mc * 1.8;
    if (conv2 || click2) tips.push({key: "mobile", lvl: mob.visitors >= desk.visitors ? "high" : "med", impact: mob.visitors >= desk.visitors ? 87 : 64, tag: "Phones",
      title: conv2 ? `Phone visitors sign up ${mob.conv ? (desk.conv / mob.conv).toFixed(1) + "×" : "far"} less than computer visitors` : `Phone visitors click ${mc ? (dc / mc).toFixed(1) + "×" : "far"} less than computer visitors`,
      short: "Your page probably works worse on phones.",
      evidence: [`${pctStr(pct(mob.visitors, V))} of your visitors are on phones`, `Phones: ${pctStr(mc)} click, ${pctStr(mob.conv)} sign up`, `Computers: ${pctStr(dc)} click, ${pctStr(desk.conv)} sign up`],
      body: "Instagram and TikTok traffic is almost all phones, so a page that only works well on a computer loses most of it.",
      steps: ["Open your site on your phone with mobile data, not Wi-Fi.", "Check the main button is visible without scrolling.", "Make text big enough to read and buttons easy to tap.", "Make sure nothing (pop-ups, banners) covers the button."],
      gain: Math.max(1, Math.round(mob.visitors * (desk.conv - mob.conv) / 100 / 2)), conf: conf(mob.visitors)});
  }

  // 7. One page and gone
  if (V >= 10 && m.bounce >= 55 && !tips.some(t => t.key === "cta")) tips.push({key: "bounce", lvl: "med", impact: 70, tag: "First impression",
    title: `${pctStr(m.bounce)} of visitors leave after one look`, short: "Match your page to the post that sent them.",
    evidence: [`${pctStr(m.bounce)} viewed one page and did nothing else`],
    body: "This usually means the page doesn’t match what people expected from the post or link that sent them.",
    steps: ["Reuse the hook from your post as your headline.", "Show the thing you talked about in the first screen.", "Remove anything that loads slowly at the top."],
    gain: Math.max(1, Math.round(c.signups * .15)), conf: conf(V)});

  // 8. Exit page
  const ex = m.exits.find(x => x.page !== "/");
  if (ex && m.leavers >= 10 && ex.share >= 25) {
    const d = m.diffs[0];
    tips.push({key: "exit:" + ex.page, lvl: ex.share >= 40 ? "high" : "med", impact: 80 + Math.min(10, ex.share / 10), tag: "Exit page",
      title: `${pctStr(ex.share)} of people who don’t sign up leave on ${ex.page}`, short: `Find out what ${ex.page} is missing.`,
      evidence: [`${fmt(ex.n)} of ${fmt(m.leavers)} people who left were last on ${ex.page}`].concat(d ? [`Customers: ${d.f.charAt(0).toLowerCase() + d.f.slice(1)} (${pctStr(d.b)} vs ${pctStr(d.l)} of everyone else)`] : []),
      body: `Something on ${ex.page} makes people stop. Often it’s an unanswered question (price, how it works, is it for me) or no clear next step.`,
      steps: [`Open ${ex.page} as a first-time visitor and write down your first question.`, "Answer it on that page, near the top.", "Add one obvious button to continue."].concat(d ? [`Make “${d.f.replace(/^Visited |^Clicked /, "")}” easier to reach — customers used it much more.`] : []),
      gain: Math.max(1, Math.round(ex.n * .1 * Math.max(convRate, .05))), conf: conf(m.leavers)});
  }

  // 9. Traffic sources
  const ranked = m.sources.filter(s => s.visitors >= (V >= 60 ? 15 : 6)).sort((a, b) => b.conv - a.conv);
  if (ranked.length >= 2) {
    const best = ranked[0], worst = ranked[ranked.length - 1];
    if (best.conv > 0 && best.conv >= worst.conv * 2) tips.push({key: "src:" + worst.key, lvl: "med", impact: 60, tag: "Traffic sources",
      title: `${worst.name} visitors sign up ${worst.conv ? (best.conv / worst.conv).toFixed(1) + "× less" : "far less"} than ${best.name} visitors`, short: `Send ${worst.name} traffic somewhere that fits it.`,
      evidence: [`${best.name}: ${pctStr(best.conv)} of ${fmt(best.visitors)} sign up`, `${worst.name}: ${pctStr(worst.conv)} of ${fmt(worst.visitors)} sign up`],
      body: `${worst.name} visitors arrive with different expectations. Your page speaks to ${best.name} visitors better.`,
      steps: [`Send ${worst.name} visitors to a page that continues the post they just saw.`, `Post more of what brings ${best.name} visitors.`], conf: conf(worst.visitors)});
  }

  // 10. Getting worse
  if (V >= 30 && m.p.visitors >= 30 && m.p.conv > 0 && c.conv < m.p.conv * .7) tips.push({key: "trend", lvl: "high", impact: 89, tag: "Trend",
    title: `Sign-ups fell from ${pctStr(m.p.conv)} to ${pctStr(c.conv)} of visitors`, short: "Something changed. Find out what.",
    evidence: [`Previous ${m.days} days: ${pctStr(m.p.conv)} (${fmt(m.p.visitors)} visitors)`, `Last ${m.days} days: ${pctStr(c.conv)} (${fmt(V)} visitors)`],
    body: "Your conversion dropped compared with the period before. Usually a page change, a new traffic source, or something broken.",
    steps: ["Check what you changed on your site in this period.", "Compare traffic sources: did a new one bring visitors who don’t fit?", "Sign up yourself to check nothing is broken."], conf: conf(V)});

  // Not enough data / healthy
  if (V < 30) tips.push({key: "data", lvl: "low", impact: 20, tag: "More data needed", title: `${fmt(V)} visitor${V === 1 ? "" : "s"} so far`, short: "Patterns get reliable around 30 visitors.",
    evidence: [`${fmt(V)} of 30 visitors needed for reliable patterns`], progress: Math.min(100, V / 30 * 100),
    body: "Cards marked “Early signal” are based on very few people. Treat them as hints, not conclusions.",
    steps: ["Share your tracking link in your bio and a post.", "Come back after about 30 visitors."], href: "#campaigns", cta: "Create a tracking link", conf: conf(V)});
  else if (!tips.some(t => t.lvl === "high" || t.lvl === "med")) tips.push({key: "healthy", lvl: "good", impact: 30, tag: "Working well", title: `${pctStr(c.conv)} of visitors sign up`, short: "No big leak right now. Grow traffic next.",
    evidence: [`${fmt(c.signups)} sign-ups from ${fmt(V)} visitors`], body: "Nothing stands out as broken. Your next lever is more of the right traffic.",
    steps: ["Make a tracking link for each new post.", "Repeat the posts that bring sign-ups, not just views."], conf: conf(V)});
  return tips.sort((a, b) => b.impact - a.impact);
}

/* Built-in plan writer: turns the diagnosis into this week's plan, no AI key needed */
function writePlan(m, tips, fixes){
  const real = tips.filter(t => !["low", "good"].includes(t.lvl));
  const top = real[0], V = m.c.visitors, plan = {headline: "", why: "", actions: [], testing: [], next: ""};
  if (!top) {
    plan.headline = V < 30 ? `You have ${fmt(V)} visitor${V === 1 ? "" : "s"} so far, not enough to see a clear pattern yet.` : `No big leak right now: ${pctStr(m.c.conv)} of visitors sign up.`;
    plan.why = V < 30 ? "The fastest win this week is more of the right visitors, so the next plan can be specific." : "Your page is doing its job. Growth now comes from more of the right traffic.";
    plan.actions.push({title: "Bring in more visitors", detail: "Make a ClickSpring tracking link for your next post, put it in your bio, and post twice this week.", target: `Reach ${fmt(Math.max(30, V * 2))} visitors`});
  } else {
    plan.headline = `The biggest reason people aren’t signing up: ${top.title.charAt(0).toLowerCase() + top.title.slice(1)}.`;
    plan.why = (top.evidence || []).join(" · ");
    real.slice(0, 3).forEach((t, k) => plan.actions.push({
      title: k === 0 ? `First: ${t.short.replace(/\.$/, "")}` : t.short.replace(/\.$/, ""),
      detail: (t.steps || []).slice(0, 2).join(" "),
      target: t.gain > 0 ? `Could win back about ${fmt(t.gain)} sign-up${t.gain === 1 ? "" : "s"}` : (t.conf ? t.conf.level : "")
    }));
    if (V < 30 && plan.actions.length < 3) plan.actions.push({title: "Get more visitors to confirm this", detail: `These findings come from ${fmt(V)} visitors. Share your tracking link so the next plan is more certain.`, target: "Reach 30 visitors"});
  }
  for (const f of fixes) { const r = measureFix(f, m.journeys ? S.events : []); plan.testing.push(`${f.note || f.title}: ${r.text}`); }
  plan.next = `Press “I made this change” on the card you fix, then check back on ${dShort(new Date(Date.now() + 7 * DAY))} to see if it worked.`;
  return plan;
}
const planHTML = p => `<div class="plan"><p class="plan-h">${esc(p.headline)}</p>${p.why ? `<p class="plan-why">${esc(p.why)}</p>` : ""}
  <ol class="plan-steps">${p.actions.map(a => `<li><b>${esc(a.title)}</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ""}${a.target ? `<em>${esc(a.target)}</em>` : ""}</li>`).join("")}</ol>
  ${p.testing.length ? `<p class="plan-sub">Changes you’re testing</p><ul class="plan-test">${p.testing.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
  <p class="plan-next">${esc(p.next)}</p><button class="btn quiet sm" id="copyplan">Copy plan</button></div>`;

/* Before / after for changes the founder made */
function measureFix(fix, events){
  const T = fix.created, now = Date.now(), w = Math.min(14 * DAY, Math.max(DAY, now - T));
  const before = summarize(events.filter(e => e.s !== "test" && e.ts >= T - w && e.ts < T));
  const after = summarize(events.filter(e => e.s !== "test" && e.ts >= T && e.ts < T + 14 * DAY));
  let verdict = "early", text = "Measuring… needs about 30 visitors after the change.";
  if (after.visitors >= 30 && before.visitors >= 30) {
    const ch = before.conv ? (after.conv - before.conv) / before.conv : after.conv > 0 ? 1 : 0;
    if (ch >= .2) { verdict = "up"; text = `Sign-ups improved ${Math.round(ch * 100)}% since this change.`; }
    else if (ch <= -.2) { verdict = "down"; text = `Sign-ups dropped ${Math.round(-ch * 100)}% since this change. Consider undoing it.`; }
    else { verdict = "flat"; text = "No clear change yet."; }
  }
  return {before, after, verdict, text};
}

function examplesFor(t, m){
  const L = (m.journeys || []).filter(j => !j.converted), dev = j => (j.steps.find(e => e.d) || {}).d, k = t.key || "";
  let pick = [];

let gradN = 0;
function lineSVG(vals, {h = 56, color = "var(--green)", fill = true} = {}){
  const w = 300, n = vals.length; if (!n) return "";
  const max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => [n === 1 ? w/2 : i * w/(n - 1), h - 3 - v/max*(h - 8)]);
  const d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  const id = "lg" + (++gradN);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px" aria-hidden="true">
  ${fill ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" style="fill:url(#${id})"/>` : ""}
  <path d="${d}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const dShort = d => d.toLocaleDateString("en-US", {month: "short", day: "numeric"});

function funnelHTML(s){
  const steps = [["Visited your site", s.visitors], ["Clicked a button", s.clickers], ["Signed up", s.signups]];
  const top = Math.max(1, s.visitors);
  let worst = -1, worstLoss = -1;
  for (let i = 1; i < steps.length; i++) { const l = steps[i-1][1] ? 1 - steps[i][1] / steps[i-1][1] : 0; if (l > worstLoss) { worstLoss = l; worst = i; } }
  return `<div class="funnel">${steps.map(([nm, v], i) => {
    const w = 14 + 86 * Math.sqrt(v / top);
    const loss = i > 0 ? `<div class="loss ${i === worst && steps[i-1][1] ? "big" : ""}">${fmt(steps[i-1][1] - v)} lost here (${pctStr(pct(steps[i-1][1] - v, steps[i-1][1]))})${i === worst && steps[i-1][1] ? " – your biggest leak" : ""}</div>` : "";
    return `${loss}<div class="row"><span class="nm">${nm}</span><span class="ct">${fmt(v)} <span class="muted" style="font-weight:500">· ${pctStr(pct(v, top))}</span></span><div class="bar" style="--w:${w}%;--o:${1 - i*.22}"></div></div>`;
  }).join("")}</div>`;
}

const DEMO_VIDEO_URL = "";
function videoEmbed(url){
  if (!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0&modestbranding=1" title="ClickSpring demo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return `<iframe src="https://player.vimeo.com/video/${m[1]}?autoplay=1&color=1fbf4f" title="ClickSpring demo" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  return `<video src="${esc(url)}" controls autoplay playsinline></video>`;
}

/* Hero demo: an animated cursor installs ClickSpring, watches visitors arrive, and applies the fix. Loops. */
function heroDemo(root){
  const demo = root.querySelector(".demo"); if (!demo) return;
  const cur = demo.querySelector(".d-cursor"), wait = ms => new Promise(r => setTimeout(r, ms));
  const alive = () => document.body.contains(demo);
  const pos = (el, dx = .5, dy = .55) => { const a = demo.getBoundingClientRect(), b = el.getBoundingClientRect(); return [b.left - a.left + b.width * dx, b.top - a.top + b.height * dy]; };
  const move = async (el, dx, dy) => { const [x, y] = pos(el, dx, dy); cur.style.transform = `translate(${x - 5}px, ${y - 3}px)`; await wait(900); };
  const click = async el => { cur.classList.add("press"); if (el) el.classList.add("pressed"); const [x, y] = pos(el || cur); const r = document.createElement("span"); r.className = "d-ripple"; r.style.left = x + "px"; r.style.top = y + "px"; demo.appendChild(r); await wait(180); cur.classList.remove("press"); if (el) el.classList.remove("pressed"); await wait(300); r.remove(); };
  const show = name => { demo.querySelectorAll(".sc").forEach(s => s.classList.toggle("on", s.dataset.sc === name)); demo.querySelectorAll(".demo-tabs span").forEach(t => t.classList.toggle("on", t.dataset.t === name)); root.querySelectorAll(".demo-steps span").forEach(t => t.classList.toggle("on", t.dataset.st === name)); };
  const q = s => demo.querySelector(s);
  const reset = () => {
    show("setup"); q(".d-copy").textContent = "Copy"; q(".d-status").classList.remove("ok"); q(".d-status b").textContent = "Waiting for visitors…";
    demo.querySelectorAll("[data-n]").forEach(n => n.textContent = "0"); demo.querySelectorAll(".d-bar i").forEach(b => b.style.width = "0");
    q(".d-loss").classList.remove("show"); q(".d-made").classList.remove("done"); q(".d-made").textContent = "I made this change"; q(".d-after").classList.remove("show");
    const a = demo.getBoundingClientRect(); cur.style.transition = "none"; cur.style.transform = `translate(${a.width * .8}px, ${a.height * .9}px)`; void cur.offsetWidth; cur.style.transition = "";
  };
  const count = () => demo.querySelectorAll("[data-n]").forEach(n => { const end = +n.dataset.n; let t0 = null; const f = t => { if (!t0) t0 = t; const p = Math.min(1, (t - t0) / 1300); n.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))).toLocaleString("en-US"); if (p < 1 && alive()) requestAnimationFrame(f); }; requestAnimationFrame(f); });
  if (calmMotion()) { show("why"); q(".d-made").classList.add("done"); q(".d-made").textContent = "Measuring ✓"; q(".d-after").classList.add("show"); return; }
  (async function loop(){
    while (alive()) {
      reset(); await wait(900); if (!alive()) return;
      await move(q(".d-copy")); await click(q(".d-copy")); q(".d-copy").textContent = "Copied ✓"; await wait(700);
      q(".d-status").classList.add("ok"); q(".d-status b").textContent = "Tracking is working ✓"; await wait(1300); if (!alive()) return;
      await move(q('.demo-tabs [data-t="numbers"]')); await click(q('.demo-tabs [data-t="numbers"]')); show("numbers");
      await wait(250); demo.querySelectorAll(".d-bar i").forEach(b => b.style.width = b.dataset.w + "%"); count(); q(".d-loss").classList.add("show");
      await wait(2600); if (!alive()) return;
      await move(q('.demo-tabs [data-t="why"]')); await click(q('.demo-tabs [data-t="why"]')); show("why"); await wait(1500);
      await move(q(".d-made")); await click(q(".d-made")); q(".d-made").classList.add("done"); q(".d-made").textContent = "Measuring ✓";
      await wait(700); q(".d-after").classList.add("show"); await wait(3400);
    }
  })();
}

/* Scroll reveals, parallax, sticky nav, progress bar, chart draw, count-up */
let landingFx = null;
function animateLanding(){
  if (landingFx) { removeEventListener("scroll", landingFx); landingFx = null; }
  const root = $(".landing"); if (!root) return;
  const calm = calmMotion(), nav = root.querySelector(".nav-wrap"), bar = root.querySelector(".progress"), sw = root.querySelectorAll(".swoosh");
  const mark = (sel, cls = "", step = 0) => root.querySelectorAll(sel).forEach((el, k) => { el.classList.add("rv"); if (cls) el.classList.add(cls); el.style.setProperty("--d", (k * step).toFixed(2) + "s"); });
  if (!calm) {
    mark(".sec-h"); mark(".how-step", "", .12); mark("#why .wc", "", .12);
    mark(".feat", "", .08); mark(".faq-list details", "", .06);
    mark(".founder-card", "zoom");
    mark(".band-in", "zoom"); mark(".final"); mark(".foot-note");
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold: .14, rootMargin: "0px 0px -6% 0px"});
    root.querySelectorAll(".rv").forEach(el => io.observe(el));
    const line = root.querySelector(".mock-chart path"); if (line) { const L = Math.ceil(line.getTotalLength()); line.style.strokeDasharray = L; line.style.strokeDashoffset = L; line.classList.add("drawn"); }
    root.querySelectorAll(".mock-stats b").forEach(b => {
      const m = b.textContent.match(/^([\d.]+)(\D*)$/); if (!m) return;
      const end = parseFloat(m[1]), dec = (m[1].split(".")[1] || "").length, suf = m[2]; let t0 = null;
      const step = t => { if (!t0) t0 = t; const p = Math.min(1, (t - t0) / 1400), v = end * (1 - Math.pow(1 - p, 3)); b.textContent = v.toFixed(dec) + suf; if (p < 1) requestAnimationFrame(step); };
      setTimeout(() => requestAnimationFrame(step), 500);
    });
  }
  let ticking = false;
  landingFx = () => {
    if (!document.body.contains(root)) { removeEventListener("scroll", landingFx); landingFx = null; return; }
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
      if (nav) nav.classList.toggle("sc", y > 12);
      if (bar) bar.style.transform = `scaleX(${h > 0 ? Math.min(1, y / h) : 0})`;
      if (!calm) sw.forEach(el => el.style.transform = `translate3d(0, ${y * .18}px, 0)`);
      ticking = false;
    });
  };
  addEventListener("scroll", landingFx, {passive: true}); landingFx();
  heroDemo(root);
}

function friendly(err){
  const m = String((err && err.message) || err || "");
  if (/invalid login credentials/i.test(m)) return "That email and password don’t match. Try again, or reset your password.";
  if (/email not confirmed/i.test(m)) return "Confirm your email first. Check your inbox for the link we sent.";
  if (/already registered|already been registered/i.test(m)) return "That email already has an account. Log in instead.";
  if (/password should be at least|weak password/i.test(m)) return "Use a password with at least 8 characters.";
  if (/this device already has|too many new accounts/i.test(m)) return m;
  if (/beta limit/i.test(m)) return m.replace(/^.*?ClickSpring beta limit( reached)?:\s*/i, "Free beta limit: ") + ".";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute, then try again.";
  if (/failed to fetch|network/i.test(m)) return "Can’t reach the server. Check your connection and try again.";
  return m || "Something went wrong. Try again.";
}

function showErr(msg){ const e = $("#err"); if (!e) return toast(msg); e.textContent = msg; e.hidden = false; }
function flashHTML(){ const f = S.flash; S.flash = null; return f ? `<div class="alert ${f.type}" role="status">${esc(f.text)}</div>` : ""; }
function normUrl(v){
  v = String(v || "").trim(); if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { const u = new URL(v); return /\./.test(u.hostname) ? u.origin + (u.pathname === "/" ? "" : u.pathname.replace(/\/$/, "")) : null; } catch (e) { return null; }
}
async function ensureSite(){
  if (S.site || !store.user) return S.site;
  const m = store.user.user_metadata || store.user, url = normUrl(m.site_url);
  if (!url) return null;
  try { S.site = await store.createSite({name: m.site_name || new URL(url).hostname, url, owner: store.userName()}); } catch (e) { console.warn(e); }
  return S.site;
}
async function afterLogin(site){
  S.site = site; S.user = store.user;
  if (!S.site) await ensureSite();
  $("#root").innerHTML = "";
  location.hash = S.site ? "#advisor" : "#start";
}

function checkInbox(email, password){
  $(".auth-card").innerHTML = `<div class="mail-ic">${ic("bell", 28)}</div><h1>Confirm your email</h1>
    <p class="sub">We sent a link to <b>${esc(email)}</b>. Open it on any device. This page continues to your dashboard by itself once you confirm.</p>
    <div class="waiting"><span class="st-dot wait"></span>Waiting for you to confirm…</div>
    <p class="hint" style="margin:0 0 16px">Can’t find it? Check spam or promotions. It comes from ClickSpring.</p>
    <button class="btn quiet wide" id="resend">Resend email</button><p class="switch"><a href="#login">Back to log in</a></p>`;
  $("#resend").addEventListener("click", async e => { const b = e.currentTarget; b.disabled = true; try { await store.resend(email); toast("Email sent again"); } catch (err) { toast(friendly(err)); } setTimeout(() => b.disabled = false, 30000); });
  let busy = false, tries = 0;
  const check = async () => {
    if (!$("#resend")) return stop();
    if (busy || ++tries > 120) return; busy = true;
    try { const site = await store.signIn({email, password}); stop(); toast("Email confirmed. Welcome to ClickSpring!"); await afterLogin(site); }
    catch (err) { /* not confirmed yet */ }
    busy = false;
  };
  const timer = setInterval(check, 5000), onVis = () => { if (!document.hidden) check(); };
  document.addEventListener("visibilitychange", onVis);
  function stop(){ clearInterval(timer); document.removeEventListener("visibilitychange", onVis); }
}

  $("#so").addEventListener("click", async e => { e.preventDefault(); await store.signOut(); S.site = null; location.hash = "#login"; });

    try { S.site = await store.createSite({...fd, owner: name}); $("#root").innerHTML = ""; location.hash = "#install"; }
    catch (err) { showErr(friendly(err)); b.disabled = false; }
  });
}

const withParam = (url, k, v) => { try { const u = new URL(url); u.searchParams.set(k, v); return u.toString(); } catch (e) { return url; } };
const ago = ts => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)} min ago` : s < 86400 ? `${Math.round(s/3600)} h ago` : `${Math.round(s/86400)} d ago`; };
const EV_NAME = {pageview: "Page view", click: "Click", signup: "Sign-up"};
async function checkStatus(){
  const box = $("#status"); if (!box) { clearInterval(S.poll); return; }
  let st; try { st = await store.status(); } catch (e) { box.innerHTML = `<div class="st-row"><span class="st-dot bad"></span><div><b>Couldn’t check your tracking</b><p class="muted">${esc(friendly(e))}</p></div></div>`; return; }
  if (!$("#status")) return;
  const items = [["Script installed", st.pageview, "A page view arrived from your site."], ["Clicks tracked", st.click, "Someone clicked a button or link."], ["Sign-ups tracked", st.signup, "A sign-up form was submitted."], ["Tracking link used", st.campaign, "A visit came from one of your links."]];
  const lastEv = st.recent[0], working = !!lastEv;
  box.innerHTML = `<div class="st-row"><span class="st-dot ${working ? "ok" : "wait"}"></span><div><b>${working ? "Tracking is working" : "Waiting for your first visit"}</b>
    <p class="muted">${working ? `Last event ${ago(lastEv.ts)}: ${EV_NAME[lastEv.t] || lastEv.t} on ${esc(lastEv.p || "/")}${lastEv.s === "test" ? " (test)" : ""}.` : "Add the script to your site, then open it in test mode. This updates by itself."}</p></div></div>
    <ul class="checks">${items.map(([n, ok, d]) => `<li class="${ok ? "done" : ""}"><span class="ck">${ok ? "✓" : ""}</span><div><b>${n}</b><small>${ok ? d : "Not yet"}</small></div></li>`).join("")}</ul>`;
  const feed = $("#feed");
  if (feed) feed.innerHTML = st.recent.length ? `<div class="tbl-wrap"><table><thead><tr><th>Event</th><th>Page</th><th>Source</th><th>Detail</th><th class="num">When</th></tr></thead><tbody>${st.recent.map(e => `<tr><td><span class="ev ev-${e.t}">${EV_NAME[e.t] || esc(e.t)}</span></td><td>${esc(e.p || "/")}</td><td>${e.s === "test" ? "Test" : esc(srcName(e.s))}</td><td class="muted">${esc(e.l || "")}</td><td class="num muted">${ago(e.ts)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No events yet.</p>`;
}

function sourcesTable(rows){
  if (!rows.length) return `<p class="muted">No traffic yet.</p>`;
  const max = Math.max(...rows.map(r => r.visitors));
  return `<div class="tbl-wrap"><table><thead><tr><th>Source</th><th></th><th class="num">Visitors</th><th class="num">Clicked</th><th class="num">Signed up</th><th class="num">Conversion</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><span class="dot" style="background:${srcColor(r.key)}"></span>${esc(r.name)}</td><td style="width:30%"><div class="src-bar"><i style="width:${r.visitors/max*100}%;background:${srcColor(r.key)}"></i></div></td><td class="num">${fmt(r.visitors)}</td><td class="num">${fmt(r.clickers)}</td><td class="num">${fmt(r.signups)}</td><td class="num"><b>${pctStr(r.conv)}</b></td></tr>`).join("")}
  </tbody></table></div>`;
}
function trackLink(c){
  const u = S.site.url || "https://example.com";
  return u + (u.includes("?") ? "&" : "?") + `utm_source=${encodeURIComponent(c.platform)}&utm_medium=social&utm_campaign=${encodeURIComponent(c.slug)}&cs_c=${c.id}`;
}
function campHTML(c){
  const vr = c.views ? pctStr(pct(c.visitors, c.views)) : "–";
  return `<div class="camp"><div class="camp-h"><div><span class="dot" style="background:${srcColor(c.platform)}"></span><b>${esc(c.name)}</b> <span class="muted">· ${srcName(c.platform)}</span></div>
    <label class="muted" style="font-size:13px;font-weight:600">Post views <input class="views-in" type="number" min="0" inputmode="numeric" data-id="${c.id}" value="${c.views || ""}" placeholder="Add views"></label></div>
    <div class="camp-stats"><div><small>Views</small><strong>${c.views ? fmt(c.views) : "–"}</strong></div><div><small>Visits</small><strong>${fmt(c.visitors)}</strong></div>
    <div><small>View → visit</small><strong>${vr}</strong></div><div><small>Sign-ups</small><strong>${fmt(c.signups)}</strong></div><div><small>Visit → sign-up</small><strong>${pctStr(c.conv)}</strong></div></div>
    <div class="linkbox"><code>${esc(trackLink(c))}</code><button class="btn sm" data-act="copy" data-id="${c.id}">Copy link</button><button class="btn quiet sm" data-act="del" data-id="${c.id}" aria-label="Delete link">Delete</button></div></div>`;
}
function aiSummary(){
  const m = S.m, c = m.c;
  return { website: S.site.url, period_days: m.days, visitors: c.visitors, clicked: c.clickers, button_clicks: c.clicks, signups: c.signups,
    conversion_pct: +c.conv.toFixed(2), one_page_and_left_pct: +m.bounce.toFixed(1),
    previous_period: { visitors: m.p.visitors, signups: m.p.signups },
    sources: m.sources.map(s => ({ source: s.name, visitors: s.visitors, clicked: s.clickers, signups: s.signups })),
    campaigns: m.camps.map(x => ({ post: x.name, platform: x.platform, views: x.views, visits: x.visitors, signups: x.signups })),
    top_buttons: m.buttons, top_pages: m.pages, exit_pages: m.exits, customers_did_more: m.diffs, clicked_then_left: m.clickedLeft, devices: m.devices.map(d => ({device: d.key, visitors: d.visitors, clicked: d.clickers, signups: d.signups})), signups_ever_recorded: m.signupEver, diagnosis: advise(m).map(t => ({problem: t.title, evidence: t.evidence, confidence: t.conf && t.conf.level})), changes_tested: (S.fixes || []).map(f => { const r = measureFix(f, S.events); return {change: f.note || f.title, since: new Date(f.created).toISOString().slice(0, 10), before_conv_pct: +r.before.conv.toFixed(2), after_conv_pct: +r.after.conv.toFixed(2), after_visitors: r.after.visitors}; }) };
}

/* ---------- Guided tour (animated cursor) ---------- */
const TOUR = [
  {route: "advisor", sel: ".why-hero", title: "Why people aren’t buying", body: "This is the heart of ClickSpring: the main reason visitors leave without signing up, in plain words, with the numbers behind it."},
  {route: "advisor", sel: ".why-r", title: "Where they drop off", body: "Visit → click → sign up. The red line marks the step where you lose the most people."},
  {route: "advisor", sel: "#tip-0", title: "Every reason, ranked", body: "Each card is one reason people leave, ranked by how many customers it costs you, with steps to fix it."},
  {route: "advisor", sel: "#tip-0 .ex, #tip-0 .evid", title: "Proof from real visitors", body: "Open any card to see the actual visitors behind it: where they came from, what they clicked, and where they left."},
  {route: "advisor", sel: "[data-fix]", title: "Fix it, then measure it", body: "Made a change? Press this. ClickSpring compares sign-ups before and after, so you know if it worked."},
  {route: "advisor", sel: "#ask", title: "Your plan for the week", body: "Turns all of this into 3 steps, in order."},
  {route: "journeys", nav: "journeys", sel: ".grid.halves > .card:nth-child(2)", title: "What customers did differently", body: "Pages and buttons your customers used far more than everyone else. Make those easier to find."},
  {route: "campaigns", nav: "campaigns", sel: "#cf", title: "One tracking link per post", body: "Make a link for each post and put it in your bio. You’ll see which posts bring customers, not just views."},
  {route: "install", nav: "install", sel: "#status", title: "Check your tracking", body: "Add the script to your site, then open it in test mode. This turns green by itself as soon as visits arrive."},
  {route: null, sel: "#tour-help", title: "You’re all set", body: "Replay this tour any time from the ? button."}
];
const tSleep = ms => new Promise(r => setTimeout(r, ms));
const calmMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const isVisible = el => { if (!el) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
const pick = sel => [...document.querySelectorAll(sel)].find(isVisible) || null;
const navEl = k => pick(`.side [data-k="${k}"]`) || pick(`.tabs [data-k="${k}"]`) || pick("#menu");
const waitSeq = (s0, ms = 7000) => new Promise(res => { const t0 = Date.now(); (function f(){ if ((S.seq || 0) > s0 || Date.now() - t0 > ms) return res(); setTimeout(f, 60); })(); });
const tourKey = () => "cs_tour_" + (store.userEmail() || "guest");
const tourSeen = () => { try { return localStorage.getItem(tourKey()) === "1"; } catch (e) { return true; } };

const Tour = {
  active: false, i: 0, el: null, token: 0, x: 0, y: 0,
  build(){
    const L = document.createElement("div"); L.id = "tour";
    L.innerHTML = `<div class="tour-block"></div><div class="tour-spot"></div>
      <div class="tour-cursor" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 28 28"><path d="M5 3l17 9.6-7.5 1.7L11 21.5z" fill="#0b0f0c" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="tour-tip" role="dialog" aria-label="App tour"></div><div class="tour-sample" hidden>Sample data for the tour</div>`;
    document.body.appendChild(L);
    this.L = L; this.cursor = L.querySelector(".tour-cursor"); this.spotEl = L.querySelector(".tour-spot"); this.tip = L.querySelector(".tour-tip");
    this.tip.addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; b.dataset.t === "next" ? this.next() : b.dataset.t === "back" ? this.back() : this.end(); });
    this.place(innerWidth * .5, innerHeight * .75);
    this.onMove = () => { if (this.el) { this.spot(this.el); this.position(this.el); } };
    this.onKey = e => { if (e.key === "Escape") this.end(); else if (e.key === "ArrowRight") this.next(); else if (e.key === "ArrowLeft") this.back(); };
    addEventListener("resize", this.onMove); addEventListener("scroll", this.onMove, true); addEventListener("keydown", this.onKey);
  },
  async start(){
    if (this.active || !S.site) return;
    const sheet = $("#sheet"); if (sheet) sheet.classList.remove("open");
    this.active = true; this.build();
    const s0 = S.seq || 0;
    if (location.hash !== "#advisor") location.hash = "#advisor"; else route();
    await waitSeq(s0);
    this.go(0);
  },
  place(x, y){ this.x = x; this.y = y; this.cursor.style.transform = `translate(${x - 5}px, ${y - 3}px)`; },
  point(el){ const r = el.getBoundingClientRect(); return [r.left + Math.min(r.width / 2, 56), r.top + Math.min(r.height / 2, 30)]; },
  async moveTo(el){ const [x, y] = this.point(el); this.place(x, y); await tSleep(calmMotion() ? 0 : 950); },
  async press(){
    this.cursor.classList.add("press");
    const rp = document.createElement("div"); rp.className = "tour-ripple"; rp.style.left = this.x + "px"; rp.style.top = this.y + "px"; this.L.appendChild(rp);
    await tSleep(260); this.cursor.classList.remove("press"); await tSleep(260); rp.remove();
  },
  spot(el){
    const r = el.getBoundingClientRect(), p = 8, vh = innerHeight;
    const top = Math.max(4, r.top - p), bottom = Math.min(vh - 4, r.bottom + p);
    Object.assign(this.spotEl.style, {left: r.left - p + "px", top: top + "px", width: r.width + p * 2 + "px", height: Math.max(0, bottom - top) + "px"});
  },
  position(el){
    const r = el.getBoundingClientRect(), t = this.tip, tw = t.offsetWidth, th = t.offsetHeight, vw = innerWidth, vh = innerHeight, gap = 16;
    let top;
    if (vh - r.bottom > th + gap + 12) top = r.bottom + gap;
    else if (r.top > th + gap + 12) top = r.top - gap - th;
    else top = vh - th - 16;
    const left = Math.min(Math.max(12, r.left), vw - tw - 12);
    t.style.left = left + "px"; t.style.top = Math.max(12, top) + "px";
  },
  render(st){
    const last = this.i === TOUR.length - 1;
    this.tip.innerHTML = `<div class="tour-top"><span>${this.i + 1} of ${TOUR.length}</span>${last ? "" : `<button class="tour-skip" data-t="skip">Skip tour</button>`}</div>
      <h3>${st.title}</h3><p>${st.body}</p>
      <div class="tour-foot"><div class="tour-dots">${TOUR.map((_, k) => `<i class="${k === this.i ? "on" : ""}"></i>`).join("")}</div>
      <div class="tour-nav">${this.i ? `<button class="btn quiet sm" data-t="back">Back</button>` : ""}<button class="btn green sm" data-t="next">${last ? "Finish" : "Next"} ${ic("arrow", 14)}</button></div></div>`;
  },
  async go(i){
    const tk = ++this.token; this.i = i; const st = TOUR[i];
    this.tip.classList.remove("in"); this.el = null;
    if (st.route && location.hash.slice(1) !== st.route) {
      if (st.nav) {
        const n = navEl(st.nav);
        if (n) { this.spot(n); await this.moveTo(n); if (tk !== this.token) return; await this.press(); if (tk !== this.token) return; }
      }
      const s0 = S.seq || 0; location.hash = "#" + st.route; await waitSeq(s0);
      if (tk !== this.token) return;
    }
    this.L.querySelector(".tour-sample").hidden = !S.sample;
    const el = pick(st.sel) || pick("#view .card");
    if (!el) { if (i < TOUR.length - 1) return this.go(i + 1); return this.end(); }
    el.scrollIntoView({block: "center", behavior: calmMotion() ? "auto" : "smooth"});
    await tSleep(calmMotion() ? 0 : 420); if (tk !== this.token) return;
    this.el = el; this.spot(el);
    await this.moveTo(el); if (tk !== this.token) return;
    this.render(st); this.position(el);
    requestAnimationFrame(() => { this.tip.classList.add("in"); const nb = this.tip.querySelector('[data-t="next"]'); if (nb) nb.focus({preventScroll: true}); });
  },
  next(){ if (this.i >= TOUR.length - 1) return this.end(); this.go(this.i + 1); },
  back(){ if (this.i > 0) this.go(this.i - 1); },
  end(){
    if (!this.active) return;
    this.token++; this.active = false; this.el = null;
    removeEventListener("resize", this.onMove); removeEventListener("scroll", this.onMove, true); removeEventListener("keydown", this.onKey);
    if (this.L) this.L.remove();
    try { localStorage.setItem(tourKey(), "1"); } catch (e) {}
    if (S.sample) { S.sample = false; route(); }
  }
};

/* ---------- Boot ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("[data-demo]")) { e.preventDefault(); openDemo(); }
  const sc = e.target.closest("[data-scroll]"); if (sc) { const el = document.getElementById(sc.dataset.scroll); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});
document.addEventListener("change", e => { if (e.target.matches(".range-sel")) { S.days = +e.target.value; route(); } if (e.target.matches(".sitesel")) switchSite(e.target.value); });
window.addEventListener("hashchange", () => { if (!APP_ROUTES.has(location.hash.slice(1))) $("#root").innerHTML = ""; route(); });
(async () => {
  try { S.site = await store.init(); if (store.user && !S.site) await ensureSite(); } catch (e) { console.error(e); }
  if (S.welcome) setTimeout(() => toast("Email confirmed. Welcome to ClickSpring!"), 600);
  if (store.live && store.user && !location.hash && !S.recovery) { location.hash = S.site ? "#advisor" : "#start"; return; }
  route();
})();
})();
</script>
